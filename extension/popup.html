<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết nối SeedingSys</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Kết nối SeedingSys</h1>
    <p class="dashboard">Dashboard <output id="origin"></output></p>
    <form>
      <label>Mã profile <input id="token" type="password" autocomplete="off" required></label>
      <button type="submit">Kết nối</button>
      <button type="button" id="check" disabled>Kiểm tra kết nối</button>
      <button type="button" id="instagram">Cho phép đọc Instagram</button>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
